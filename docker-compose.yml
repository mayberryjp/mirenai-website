services:
  frontend:
    image: mirenai-website:dev
    ports:
      - "3030:8080"
    environment:
      # Rewritten into the built assets at container start by env.sh (runtime, not build-time).
      # The browser calls this origin directly; mirenai has open CORS.
      - MIRENAI_API_BASE_URL=http://localhost:8000
